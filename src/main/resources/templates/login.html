<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Inventory System</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        .card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            width: 350px; 
            text-align: center;
            transition: transform 0.3s ease;
        }

        h2 { color: #2c3e50; margin-bottom: 5px; font-size: 26px; }

        p.subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 2px solid #ecf0f1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        input:focus { outline: none; border-color: #3498db; background-color: #f7f9fb; }

        button { 
            width: 100%; 
            padding: 14px; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 15px; 
            transition: all 0.3s ease;
        }

        button:hover { background: #2980b9; box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4); }

        /* Error and Success Messages */
        .alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; }
        .error { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

        footer { margin-top: 20px; font-size: 12px; color: #bdc3c7; }
    </style>
</head>
<body>
    <div class="card">
        <h2>System Login</h2>
        <p class="subtitle">Enter your Login Credentials</p>
        
        <div th:if="${param.error}" class="alert error">
            <strong>Access Denied:</strong> Invalid ID or Password
        </div>

        <div th:if="${param.logout}" class="alert success">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Reg: 24RP09087" required autofocus>
            <input type="password" name="password" placeholder="Pass: 24RP04278" required>
            <button type="submit">Log In</button>
        </form>

        <footer>
            &copy; 2026 Fabrigas & Consessa
        </footer>
    </div>
</body>
</html>
