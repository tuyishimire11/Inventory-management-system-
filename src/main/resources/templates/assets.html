<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asset Inventory</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 12px; max-width: 1200px; margin: auto; }
        h1 { color: #2c3e50; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #3498db; color: white; }
        .btn { display: inline-block; padding: 6px 12px; margin: 2px; text-decoration: none; border-radius: 4px; font-size: 12px; }
        .btn-add { background: #2ecc71; color: white; padding: 10px 20px; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-issue { background: #f39c12; color: white; }
        .btn-return { background: #1abc9c; color: white; }
        .search-form { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .search-form input, .search-form select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .nav-links { margin-top: 20px; text-align: center; }
        .nav-links a { margin: 0 10px; text-decoration: none; background: #3498db; color: white; padding: 10px 15px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Asset Inventory</h1>

    <!-- Search Form filter -->
    <form method="get" action="/assets" class="search-form">
        <input type="text" name="deviceType" placeholder="Device Type" th:value="${param.deviceType}">
        <input type="text" name="department" placeholder="Department" th:value="${param.department}">
        <select name="condition">
            <option value="">All Conditions</option>
            <option value="New" th:selected="${param.condition == 'New'}">New</option>
            <option value="Good" th:selected="${param.condition == 'Good'}">Used</option>
            <option value="Faulty" th:selected="${param.condition == 'Faulty'}">Faulty</option>
        </select>
        <select name="status">
            <option value="">All Statuses</option>
            <option value="AVAILABLE" th:selected="${param.status == 'AVAILABLE'}">Available</option>
            <option value="ASSIGNED" th:selected="${param.status == 'ASSIGNED'}">Assigned</option>
            <option value="UNDER_REPAIR" th:selected="${param.status == 'UNDER_REPAIR'}">Under Repair</option>
            <option value="RETIRED" th:selected="${param.status == 'RETIRED'}">Retired</option>
        </select>
        <button type="submit">Search</button>
        <a href="/assets" class="btn" style="background:#95a5a6; color:white; padding:8px 12px;">Reset</a>
    </form>

    <table>
        <thead>
            <tr><th>ID</th><th>Device Type</th><th>Serial</th><th>Owner</th><th>Dept</th><th>Condition</th><th>Status</th><th>Issue Date</th><th>Return Date</th><th>Actions</th></tr>
        </thead>
        <tbody>
            <tr th:each="asset : ${assets}">
                <td th:text="${asset.id}">1</td>
                <td th:text="${asset.deviceType}">Laptop</td>
                <td th:text="${asset.serialNumber}">SN123</td>
                <td th:text="${asset.ownerName != null ? asset.ownerName : '—'}">—</td>
                <td th:text="${asset.department != null ? asset.department : '—'}">—</td>
                <td th:text="${asset.condition}">Used</td>
                <td th:text="${asset.status}">AVAILABLE</td>
                <td th:text="${asset.issueDate != null ? asset.issueDate : '—'}">—</td>
                <td th:text="${asset.returnDate != null ? asset.returnDate : '—'}">—</td>
                <td>
                    <a th:href="@{/asset/issue/{id}(id=${asset.id})}" class="btn btn-issue">Issue</a>
                    <a th:href="@{/asset/return/{id}(id=${asset.id})}" class="btn btn-return">Return</a>
                    <a th:href="@{/asset/delete/{id}(id=${asset.id})}" class="btn btn-delete" onclick="return confirm('Delete?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${assets.isEmpty()}">
                <td colspan="10" style="text-align:center">No assets found.</td>
            </tr>
        </tbody>
    </table>

    <div class="nav-links">
        <a href="/asset/new" class="btn-add">+ Add New Asset</a>
        <a href="/reports">Reports</a>
        <a href="/audit">Audit Log</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:#e74c3c; color:white; border:none; padding:10px 15px; border-radius:4px;">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
